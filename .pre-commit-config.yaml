repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  - repo: https://github.com/psf/black
    rev: "26.5.1" # when changed, also update the version in blacken-docs
    hooks:
      - id: black

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==26.5.1]

  - repo: https://github.com/pycqa/isort
    rev: "9.0.0a3"
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"] # needed to parse pyproject.toml
        exclude: '^uv\.lock|pyproject\.toml|.*\.svg$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
        files: '^pyproject\.toml$'

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
    - id: pydocstyle
      additional_dependencies: [tomli]
      exclude: "^(tests/)|(type_checks/)|(examples/)"

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          [
            "--extra-keys",
            "metadata.interpreter metadata.kernelspec metadata.language_info metadata.vscode",
          ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.7.8"
    hooks:
      - id: uv-lock
        args: ["--check"]

  - repo: https://github.com/ansys/pre-commit-hooks
    rev: v0.8.0
    hooks:
    - id: add-license-headers
      args: ["--start_year", "2022"]

  - repo: local
    hooks:
      - id: mypy-code
        name: "mypy: strict checks on code"
        entry: uv
        language: system
        types: [python]
        require_serial: true
        exclude: "^(doc/)|(tests/)|^(examples/)"
        args: [
          "run",
          "--python=3.11",
          "--isolated",
          "--all-groups",
          "--all-extras",
          "--",
          "mypy",
          "--strict",
          "--namespace-packages",
          "--explicit-package-bases"
        ]
      - id: mypy-tests
        name: "mypy: lenient checks on tests"
        entry: uv
        language: system
        types: [python]
        require_serial: true
        files: "^(tests/)|^(examples/)"
        exclude: "^(examples/pymechanical_with_shim)"
        args: [
          "run",
          "--python=3.11",
          "--isolated",
          "--all-groups",
          "--all-extras",
          "--",
          "mypy",
          "--strict",
          "--namespace-packages",
          "--explicit-package-bases",
          "--disable-error-code", "no-untyped-def",
          "--disable-error-code", "no-untyped-call"
        ]
