[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ansys-acp-core"
version = "0.4.0.dev0"
description = "Python library for ACP - Ansys Composite PrepPost"
readme = "README.rst"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
maintainers = [{ name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "grpcio-health-checking>=1.43",
    "packaging>=15.0",
    "ansys-api-acp==0.4.0.dev0",
    "ansys-tools-common>=0.4.0",
    "ansys-tools-filetransfer>=0.2.1",
    "networkx>=3.0.0",
]

# Optional dependencies which are included in the 'extras' section.
[project.optional-dependencies]
plotting = ["pyvista[jupyter]>=0.42.0,!=0.42.2"] # To be deprecated by "graphics"
graphics = ["pyvista[jupyter]>=0.42.0,!=0.42.2"]
examples = [
    "ansys-mapdl-core[graphics]>=0.68.3",
    "ansys-dpf-composites>=0.6",
    "ansys-mechanical-core>=0.10.0",
    "matplotlib>=3.8.3",
    "scipy>=1.12.0",
]
all = [
    "pyvista[jupyter]>=0.42.0,!=0.42.2",
    "ansys-mapdl-core[graphics]>=0.68.3",
    "ansys-dpf-composites>=0.6",
    "ansys-dpf-core>=0.13",
    "ansys-mechanical-core>=0.10.0",
    "matplotlib>=3.8.3",
    "scipy>=1.12.0",
]

[project.urls]
Homepage = "https://acp.docs.pyansys.com"
Documentation = "https://acp.docs.pyansys.com"
Repository = "https://github.com/ansys/pyacp/"
Issues = "https://github.com/ansys/pyacp/issues"
Releases = "https://github.com/ansys/pyacp/releases"

[project.entry-points."ansys.tools.common.launcher"]
"ACP.direct" = "ansys.acp.core._server.direct:DirectLauncher"
"ACP.docker_compose" = "ansys.acp.core._server.docker_compose:DockerComposeLauncher"
"ACP.connect" = "ansys.acp.core._server.connect:ConnectLauncher"
"ACP.connect_local" = "ansys.acp.core._server.connect:ConnectLocalLauncher"
"ACP.__fallback__" = "ansys.acp.core._server.direct:DirectLauncher"

[dependency-groups]
dev = [
    "pre-commit>=3",
    "black>=24",
    "mypy>=1.0",
    "mypy-extensions>=1.0",
    "types-protobuf>=4.22.0.2",
    "Sphinx>=8.2.0",
    "sphinx-copybutton>=0.5.2",
    "numpydoc>=1.6.0,!=1.9.0", # exclude 1.9.0 due to https://github.com/numpy/numpydoc/issues/638
    "ansys-sphinx-theme>=1.0.0",
    "pypandoc>=1.13",
    "sphinx-gallery>=0.15.0",
    "sphinx-design>=0.5.0", # undeclared indirect dependency via PyVista
    "sphinx-jinja>=2.0.2",
    "ipykernel>=6.22.0",
    "vtk>=9.5.1",
]
test = [
    "pytest>=7.3.1,<9.1.0", # limiting to <9.1.0 due to pytest-cases incompatibility, see https://github.com/smarie/python-pytest-cases/issues/385
    "pytest-cov>=4.0.0",
    "pytest-cases>=3.6.14",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.68.2",
    "docker>=7.0",
]

[tool.hatch.build]
include = ["src/**/docker-compose-*.yaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/ansys"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
force_sort_within_sections = true
line_length = 100
default_section = "THIRDPARTY"
known_first_party = ["ansys"]
src_paths = ["doc", "src", "tests"]

[tool.pydocstyle]
convention = "numpy"
add-ignore = "D201,D202,D203,D204,D105" # blank line rules before / after docstring; magic methods

[tool.codespell]
skip = '*.cdb,*.dat'
ignore-words-list = 'ans,uptodate,notuptodate,eyt,abd,synopsys'
quiet-level = 3

[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/tests"
disable_error_code = "type-abstract"
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "docker.*",
    "grpc_health.*",
    "grpc.*",
    "networkx",
    "scipy.optimize",
    "ansys.mapdl",
    "ansys.mapdl.core",
    "ansys.mechanical",
    "ansys.mechanical.*",
    "ansys.dpf.core",
    "ansys.dpf.core.core",
    "ansys.dpf.core.*",
    "ansys.tools.path",
    ".conftest",           # mypy doesn't seem to find the root 'conftest.py' when imported in 'benchmarks/conftest.py'
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# This section is required even if empty, so that pytest recognizes this
# file as a pytest configuration file, and sets the containing directory
# as its 'rootdir'.
markers = "graphics"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if (typing\\.)?TYPE_CHECKING:"]

[tool.uv.sources]
ansys-api-acp = { git = "https://github.com/ansys/ansys-api-acp.git", branch = "feat/update_protos" }
